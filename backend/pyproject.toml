[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "alpha-workbench-backend"
version = "0.1.0"
description = "Local US stock backtesting API"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<0.117",
    "numpy>=2.0",
    "pandas>=2.0",
    "pydantic>=2.0",
    "python-multipart>=0.0.9",
    "uvicorn[standard]>=0.30",
    "yfinance>=0.2",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[project.optional-dependencies]
dev = [
    "httpx>=0.27",
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
